# Permite que se ejecute cuando se hace push a la rama main (o a la que aplique)
workflow:
  rules:
  # Se ejecuta si se hace un push/merge directo a main
    - if: '$CI_COMMIT_BRANCH == "main"'

  # Se ejecuta si es un merge request dirigido a main
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

# El pipeline se va a ejecutar a develop. Dev a main ya no se debe de ejecutar.

stages:
  - security-sast
  - upload-reports
  - test_mock
  - trigger-child

variables:
  IMAGE_NAME: "api-catalogo-validador-etl"
  VERSION: $CI_COMMIT_SHORT_SHA
  IMAGE_PATH: "us-south1-docker.pkg.dev/motum-erp/despliegues-backend/${IMAGE_NAME}:v${VERSION}"
  SECURE_LOG_LEVEL: "info"

# ==================================================
# 1. ESCANEO DE SECRETOS (Gitleaks - Funcional)
# ==================================================
secret_detection:
  stage: security-sast
  image:
    name: zricethezav/gitleaks:v8.30.0
    entrypoint: [""]
  allow_failure: true
  script:
    - gitleaks detect --source . --verbose --report-format sarif --report-path gitleaks-report.sarif
  artifacts:
    when: always
    paths:
      - gitleaks-report.sarif
    expire_in: 7 days

# ==================================================
# 2. ANÁLISIS DE COMPOSICIÓN (Trivy FS SCA - Funcional)
# ==================================================
trivy_fs_scan:
  stage: security-sast
  image:
    name: aquasec/trivy:0.49.1
    entrypoint: [""]
  allow_failure: true
  script:
    - trivy fs --format sarif --output trivy-sca-report.sarif .
  artifacts:
    when: always
    paths:
      - trivy-sca-report.sarif
    expire_in: 7 days

# ==================================================
# 3. ANÁLISIS ESTÁTICO DE CÓDIGO (Semgrep SAST - Funcional)
# ==================================================
#sast_semgrep:
